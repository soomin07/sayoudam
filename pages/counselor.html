<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담사 소개 · 사유담심리상담센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=5">
</head>
<body>

<div id="siteHeader"></div>

<div class="page-hero">
  <div class="wrap">
    <div class="eyebrow">Counselor</div>
    <h1>상담사 소개</h1>
    <p>전문가를 소개합니다</p>
  </div>
</div>

<div class="page-body">
  <div class="wrap">
    <div class="counselor-grid">
      <div class="portrait" id="cPortrait">상담사 사진<br>(준비 중)</div>
      <div>
        <div class="counselor-name" id="cName2"></div>
        <div class="counselor-role" id="cRole2"></div>
        <blockquote class="counselor-phil" id="cPhil2"></blockquote>
        <div class="prof-wrap" id="cCareer2"></div>
      </div>
    </div>

    <div class="assoc-team" id="assocTeam"></div>

    <a class="back-home" href="../index.html">← 홈으로 돌아가기</a>
  </div>
</div>

<div id="siteFooter"></div>

<script src="../data.js?v=5"></script>
<script src="../common.js?v=5"></script>
<script>
(function(){
  var c = SITE.counselor;
  document.getElementById('cName2').textContent = c.name;
  document.getElementById('cRole2').textContent = c.title;
  document.getElementById('cPhil2').textContent = c.philosophy;
  document.getElementById('cCareer2').innerHTML = buildCareerHTML(c);
  if(c.photo){
    document.getElementById('cPortrait').innerHTML = '<img src="../images/' + c.photo + '" alt="' + c.name + '">';
  }

  /* ── 함께하는 상담사 (자문·수퍼비전 협력) ── */
  var a = SITE.associates;
  var host = document.getElementById('assocTeam');
  if(!a || !a.members || !a.members.length){ host.remove(); return; }

  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function list(items){ return '<ul class="career-list">'+items.map(function(i){ return '<li>'+esc(i)+'</li>'; }).join('')+'</ul>'; }
  function block(label, items){ return '<div class="prof-block"><h4 class="prof-label">'+esc(label)+'</h4>'+list(items)+'</div>'; }

  var html = '<h2>함께하는 상담사</h2>'
    + (a.lead ? '<p class="ct-lead">'+esc(a.lead)+'</p>' : '');

  a.members.forEach(function(m){
    var career = '';
    if(m.education && m.education.length) career += block('학력', m.education);
    if(m.licenses && m.licenses.length)  career += block('자격', m.licenses);
    if(m.more && m.more.length){
      career += '<details class="prof-toggle"><summary><span class="pt-txt">전체 이력 더보기</span>'
        + '<span class="pt-ico" aria-hidden="true">＋</span></summary><div class="prof-more">'
        + m.more.map(function(g){ return block(g.group, g.items); }).join('')
        + '</div></details>';
    }
    html += '<div class="counselor-grid assoc-profile">'
      + '<div class="portrait">'
        + (m.photo ? '<img src="../images/'+esc(m.photo)+'" alt="'+esc(m.name)+'">' : '상담사 사진<br>(준비 중)')
      + '</div>'
      + '<div>'
        + '<div class="counselor-name">'+esc(m.name)+'</div>'
        + (m.role ? '<div class="counselor-role">'+esc(m.role)+'</div>' : '')
        + (m.note ? '<blockquote class="counselor-phil">'+esc(m.note)+'</blockquote>' : '')
        + (m.affil && m.affil.length ? '<div class="assoc-affil">'+m.affil.map(esc).join('<br>')+'</div>' : '')
        + (career ? '<div class="prof-wrap">'+career+'</div>' : '')
      + '</div>'
    + '</div>';
  });

  host.innerHTML = html;
})();
</script>
</body>
</html>
